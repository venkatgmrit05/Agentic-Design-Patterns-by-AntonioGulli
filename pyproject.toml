[project]
name = "agentic_analytics"
version = "0.1.0"
description = "Agentic workflow exploration"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Core Application & Data Science Dependencies
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "plotly",
    "scikit-learn",
    "pyarrow",
    "pyspark",
    "opencv-python",
    "scipy",
    "Pillow",
    "requests",
    "beautifulsoup4",
    "dash",
    "Flask",
    "PyYAML",
    "GitPython",
    "click",
    "python-dateutil",
    "termcolor",
    "cloudscraper",
    "cricheroes",
    "openpyxl",
    "xlsxwriter",
    "selenium",
    "scrapy",
    "playwright",
    "torch",
    "ipykernel>=7.2.0",
    "pyzmq>=25.1.2,<27",
    "notebook>=7.5.5",
    "jupyterlab>=4.5.6",
    "jupyter-client>=8.8.0",
    "polars>=1.39.3",
    "numba>=0.65.0",
    "mamba>=0.11.3",
    "jupyter>=1.1.1",
    "torchvision>=0.26.0",
    "tensorflow>=2.21.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.1",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "langchain-community>=0.4.1",
    "langgraph>=1.1.6",
    "langchain-google-genai>=4.2.2",
    "crewai[litellm]>=1.6.1",
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
# Tools for development, research, and interactive exploration
dev = [
    "notebook",
    "ipykernel",
    "ipywidgets",
    "qtconsole",
    "autopep8",
    "debugpy",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
